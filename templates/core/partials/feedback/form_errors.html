{% load ui_copy %}
{% if form.non_field_errors or form.errors %}
  <ul class="form-error-list" role="list" aria-live="polite">
    {% for error in form.non_field_errors %}
      <li>{{ error }}</li>
    {% endfor %}
    {% for field in form %}
      {% for error in field.errors %}
        <li>{{ field.label|ui_title }}: {{ error }}</li>
      {% endfor %}
    {% endfor %}
  </ul>
{% endif %}
